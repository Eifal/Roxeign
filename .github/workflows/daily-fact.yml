name: Daily Discord Fact

on:
  schedule:
    # Berjalan setiap jam untuk mengecek jadwal dinamis di Cloudflare
    - cron: '0 * * * *'
  workflow_dispatch: # Mengizinkan trigger manual dari GitHub Actions UI

jobs:
  send-fact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Discord Bot Script
        env:
          PAGES_URL: ${{ secrets.PAGES_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/send-discord.js
